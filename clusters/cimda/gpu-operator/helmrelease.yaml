apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: gpu-operator
spec:
  interval: 10m
  timeout: 20m
  dependsOn:
    - name: prometheus
      namespace: monitoring
  chart:
    spec:
      chart: gpu-operator
      version: v26.7.1
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: gpu-operator
  install:
    crds: CreateReplace
    createNamespace: false
    remediation:
      retries: 2
  upgrade:
    crds: CreateReplace
  values:
    # The host driver, toolkit, and CDI definitions are managed outside Kubernetes.
    driver:
      enabled: false
    toolkit:
      enabled: false
    cdi:
      enabled: true
      nriPluginEnabled: false
    devicePlugin:
      env:
        - name: DEVICE_LIST_STRATEGY
          value: cdi-cri
    mig:
      strategy: none
    migManager:
      enabled: false
    dcgm:
      enabled: false
    dcgmExporter:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 30s
        additionalLabels:
          release: prometheus
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      # Basic telemetry only; profiling counters can conflict with host profilers.
      config:
        name: cimda-dcgm-metrics
        create: true
        data: |-
          DCGM_FI_DEV_GPU_UTIL, gauge, GPU utilization (percent).
          DCGM_FI_DEV_MEM_COPY_UTIL, gauge, Memory interface utilization (percent).
          DCGM_FI_DEV_FB_USED, gauge, Framebuffer memory used (MiB).
          DCGM_FI_DEV_FB_FREE, gauge, Framebuffer memory free (MiB).
          DCGM_FI_DEV_GPU_TEMP, gauge, GPU temperature (Celsius).
          DCGM_FI_DEV_POWER_USAGE, gauge, Power usage (watts).
          DCGM_FI_DEV_XID_ERRORS, gauge, Last XID error code.
          DCGM_FI_DEV_SM_CLOCK, gauge, SM clock frequency (MHz).
    sandboxWorkloads:
      enabled: false
    sandboxDevicePlugin:
      enabled: false
    kataSandboxDevicePlugin:
      enabled: false
    vfioManager:
      enabled: false
    vgpuManager:
      enabled: false
    vgpuDeviceManager:
      enabled: false
    ccManager:
      enabled: false
    # Check discovery without launching CUDA workloads or changing /dev/char.
    validator:
      driver:
        env:
          - name: DISABLE_DEV_CHAR_SYMLINK_CREATION
            value: "true"
      cuda:
        env:
          - name: WITH_WORKLOAD
            value: "false"
      plugin:
        env:
          - name: WITH_WORKLOAD
            value: "false"
