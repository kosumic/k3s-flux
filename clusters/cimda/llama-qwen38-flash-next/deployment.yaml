apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-qwen38-flash-next
  namespace: llama-qwen38
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-qwen38-flash-next
  template:
    metadata:
      labels:
        app: llama-qwen38-flash-next
      annotations:
        model-repository: huihui-ai/Huihui-Qwen3.8-Flash-Next-abliterated-GGUF
        model-revision: 73e9eb7c69fdbf667def63e233e70845e7d5ac0b
        model-quantization: UD-Q4_K_XL
    spec:
      nodeSelector:
        kubernetes.io/hostname: cimda0728-tower
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: wait-for-model
          image: busybox:1.37
          command:
            - /bin/sh
            - -ec
          args:
            - |
              until test -f /models/abliterated-huihui/.verified-73e9eb7c69fdbf667def63e233e70845e7d5ac0b; do
                sleep 30
              done
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-cuda12-b11058@sha256:480f67114291c698d2b13097e0e3efdd57e81aa3a9de6720564c307663868a59
          args:
            - --model
            - /models/abliterated-huihui/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
            - --mmproj
            - /models/abliterated-huihui/mmproj-model-bf16.gguf
            # Preserve the existing API model ID used by local Codex.
            - --alias
            - qwen3.8-flash-next-ud-iq3-xxs
            - --host
            - 0.0.0.0
            - --port
            - '8080'
            - --ctx-size
            - '32768'
            - --parallel
            - '1'
            - --n-gpu-layers
            - all
            - --split-mode
            - layer
            - --tensor-split
            - '1,1'
            - --override-tensor
            - per_layer_token_embd=CPU
            - --lazy-mode
            - 'off'
            - --flash-attn
            - 'on'
            - --jinja
            - --chat-template-file
            - /etc/llama/chat-template.jinja
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 360
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: '8'
              memory: 120Gi
              nvidia.com/gpu: '2'
            limits:
              memory: 200Gi
              nvidia.com/gpu: '2'
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
            - name: chat-template
              mountPath: /etc/llama
              readOnly: true
      volumes:
        - name: chat-template
          configMap:
            name: qwen38-codex-chat-template
        - name: model
          persistentVolumeClaim:
            claimName: qwen38-flash-next-model
