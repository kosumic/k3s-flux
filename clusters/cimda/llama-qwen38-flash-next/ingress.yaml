apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llama-qwen38-flash-next
  namespace: llama-qwen38
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: llama-qwen38-qwen-tailnet-only@kubernetescrd,llama-qwen38-qwen-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /qwen
            pathType: Prefix
            backend:
              service:
                name: llama-qwen38-flash-next
                port:
                  number: 8080
