apiVersion: batch/v1
kind: Job
metadata:
  name: qwen38-flash-next-abliterated-download
  namespace: llama-qwen38
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 172800
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: cimda0728-tower
      restartPolicy: OnFailure
      containers:
        - name: download
          image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
          command:
            - /bin/sh
            - -ec
          args:
            - |
              uvx --from 'huggingface_hub[hf_xet]==0.35.3' hf download \
                huihui-ai/Huihui-Qwen3.8-Flash-Next-abliterated-GGUF \
                --revision 73e9eb7c69fdbf667def63e233e70845e7d5ac0b \
                --include 'UD-Q4_K_XL/*.gguf' 'mmproj-model-bf16.gguf' \
                --local-dir /models/abliterated-huihui
              cd /models/abliterated-huihui
              printf '%s\n' \
                '290a31ca20b74ed2c21b257d378a5678d821ad9fdd8feb1fc52c719761668903  UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf' \
                '0ebf70d076e0e98f74dc414a90b92c67d7267876ae524bc7799cf463e27b754b  UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00002-of-00004.gguf' \
                'e9b12f44e13e60d6ef9396449f7b4356b2e2911222b8183a596830c2418db19a  UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00003-of-00004.gguf' \
                '983901b3e47686f56f5fcec87ba8c51e7e2c6996277dd77bc3fc804a1d563da3  UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00004-of-00004.gguf' \
                'dbac7334a8a433abd6cd1d1db82398ba123faa2f328696da20848e605e645ca1  mmproj-model-bf16.gguf' \
                | sha256sum -c -
              touch .verified-73e9eb7c69fdbf667def63e233e70845e7d5ac0b
          env:
            - name: HF_HOME
              value: /models/.hf-home
            - name: HF_HUB_DOWNLOAD_TIMEOUT
              value: '600'
          resources:
            requests:
              cpu: '4'
              memory: 4Gi
            limits:
              memory: 16Gi
          volumeMounts:
            - name: model
              mountPath: /models
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: qwen38-flash-next-model
