apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: ingress-system
spec:
  interval: 10m
  timeout: 10m
  releaseName: traefik
  chart:
    spec:
      chart: traefik
      version: '41.6.1'
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: ingress-system
  install:
    crds: CreateReplace
    remediation:
      retries: 2
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: traefik
    # Host-local endpoints avoid Tailscale forwarding masquerade.
    hostNetwork: true
    deployment:
      replicas: 1
      dnsPolicy: ClusterFirstWithHostNet
    updateStrategy:
      type: Recreate
    nodeSelector:
      kubernetes.io/hostname: cimda0728-tower
    ingressClass:
      name: traefik
      isDefaultClass: false
    providers:
      kubernetesCRD:
        safeNaming: false
        namespaces:
          - llama-qwen38
          - comfyui-qwen-image
          - monitoring
      kubernetesIngress:
        publishedService:
          enabled: false
        ingressEndpoint:
          ip: &tailnetAddress 100.100.130.75
        namespaces:
          - llama-qwen38
          - comfyui-qwen-image
          - monitoring
    ingressRoute:
      dashboard:
        enabled: false
    ports:
      traefik:
        hostIP: 127.0.0.1
      web:
        port: 8000
        forwardedHeaders:
          insecure: false
          trustedIPs: []
        transport:
          respondingTimeouts:
            readTimeout: 120s
            writeTimeout: 0s
            idleTimeout: 180s
      websecure:
        hostIP: 127.0.0.1
        expose:
          default: false
      metrics:
        hostIP: 127.0.0.1
    service:
      spec:
        type: ClusterIP
        externalTrafficPolicy: Local
        externalIPs:
          - *tailnetAddress
    api:
      dashboard: false
      insecure: false
    accessLog:
      enabled: false
    additionalArguments:
      - --entrypoints.web.http.aliasheadersstrategy=reject
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 512Mi
