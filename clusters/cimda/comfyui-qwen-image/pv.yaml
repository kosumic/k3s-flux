apiVersion: v1
kind: PersistentVolume
metadata:
  name: cimda-comfyui-qwen-image
spec:
  capacity:
    storage: 150Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  local:
    path: /home/data2/zelinrick/nautilus/comfyui-qwen-image
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - cimda0728-tower
