apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: comfyui-compress
  namespace: comfyui-qwen-image
spec:
  compress:
    encodings:
      - gzip
    includedContentTypes:
      - text/html
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - text/plain
      - image/svg+xml
    minResponseBodyBytes: 1024
