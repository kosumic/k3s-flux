apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 10m
  timeout: 15m
  releaseName: prometheus
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "91.8.2"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  install:
    crds: CreateReplace
    remediation:
      retries: 2
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: prometheus
    grafana:
      enabled: true
      defaultDashboardsEnabled: false
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        existingClaim: grafana
      deploymentStrategy:
        type: Recreate
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 768Mi
      grafana.ini:
        server:
          root_url: http://100.100.130.75/grafana/
          serve_from_sub_path: false
        auth.anonymous:
          enabled: true
          org_role: Viewer
        users:
          allow_sign_up: false
        analytics:
          reporting_enabled: false
          check_for_updates: false
        dashboards:
          default_home_dashboard_path: /tmp/dashboards/gpu-usage.json
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: monitoring
          provider:
            allowUiUpdates: false
    alertmanager:
      enabled: false
    # These k3s components are absent or expose metrics only on host loopback.
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    defaultRules:
      rules:
        alertmanager: false
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
    prometheus:
      service:
        type: ClusterIP
      prometheusSpec:
        replicas: 1
        retention: 7d
        retentionSize: 8GB
        scrapeInterval: 30s
        evaluationInterval: 30s
        serviceDiscoveryRole: EndpointSlice
        serviceMonitorSelector:
          matchLabels:
            release: prometheus
        serviceMonitorNamespaceSelector: {}
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 15Gi
    prometheusOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    prometheus-node-exporter:
      # Keep the metrics listener off the shared host network.
      hostNetwork: false
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
