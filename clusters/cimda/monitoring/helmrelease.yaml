apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 10m
  timeout: 15m
  releaseName: prometheus
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "91.8.2"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  install:
    crds: CreateReplace
    remediation:
      retries: 2
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: prometheus
    grafana:
      enabled: false
    alertmanager:
      enabled: false
    # These k3s components are absent or expose metrics only on host loopback.
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    defaultRules:
      rules:
        alertmanager: false
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
    prometheus:
      service:
        type: ClusterIP
      prometheusSpec:
        replicas: 1
        retention: 7d
        retentionSize: 8GB
        scrapeInterval: 30s
        evaluationInterval: 30s
        serviceMonitorSelector:
          matchLabels:
            release: prometheus
        serviceMonitorNamespaceSelector: {}
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 15Gi
    prometheusOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    prometheus-node-exporter:
      # Keep the metrics listener off the shared host network.
      hostNetwork: false
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
